{% extends "auth_base.html" %}
{% block title %}Recuperar Senha | CatálogoFilmes{% endblock %}
{% block form_content %}
<h1 class="auth-title">Recuperar senha</h1>
<p class="auth-subtitle">Digite o e-mail cadastrado na sua conta.</p>
<form method="POST" class="auth-form">
    <div class="auth-field">
        <input id="email" type="email" name="email" placeholder=" " required>
        <label for="email">E-mail</label>
    </div>
    <button type="submit" class="btn-block">Enviar link de recuperação</button>
</form>
<p class="auth-divider"><a href="{{ url_for('login') }}">Voltar para o login</a></p>
{% endblock %}

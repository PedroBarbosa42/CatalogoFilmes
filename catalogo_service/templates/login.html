{% extends "auth_base.html" %}
{% block title %}Entrar | CatálogoFilmes{% endblock %}
{% block form_content %}
<h1 class="auth-title">Entrar</h1>
<form method="POST" class="auth-form">
    <div class="auth-field">
        <input id="email" type="email" name="email" placeholder=" " required>
        <label for="email">E-mail</label>
    </div>
    <div class="auth-field">
        <input id="senha" type="password" name="senha" placeholder=" " required>
        <label for="senha">Senha</label>
    </div>
    <button type="submit" class="btn-block">Entrar</button>
</form>
<p class="auth-muted"><a href="{{ url_for('forgot_password') }}">Esqueceu a senha?</a></p>
<p class="auth-divider">Novo por aqui? <a href="/register">Crie sua conta agora</a>.</p>
{% endblock %}

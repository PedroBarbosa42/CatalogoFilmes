{% extends "auth_base.html" %}
{% block title %}Redefinir Senha | CatálogoFilmes{% endblock %}
{% block form_content %}
<h1 class="auth-title">Nova senha</h1>
<p class="auth-subtitle">Crie uma nova senha para voltar a acessar sua conta.</p>
<form method="POST" class="auth-form">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="auth-field">
        <input id="senha" type="password" name="senha" placeholder=" " required>
        <label for="senha">Nova senha</label>
    </div>
    <button type="submit" class="btn-block">Salvar nova senha</button>
</form>
<p class="auth-divider"><a href="{{ url_for('login') }}">Voltar para o login</a></p>
{% endblock %}

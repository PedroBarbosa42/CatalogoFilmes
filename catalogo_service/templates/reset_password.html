<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha | Catálogo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
  <main class="auth-panel">
    <section class="auth-intro">
      <div><p class="site-kicker">Segurança</p><h1>Nova Senha</h1></div>
      <p>Crie uma nova senha segura para voltar a acessar o seu catálogo pessoal.</p>
    </section>
    <section class="auth-form">
    <h2>Redefinir Senha</h2>
    <p class="auth-subtitle">Digite sua nova senha abaixo.</p>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %} <p class="flash">{{ messages[0] }}</p> {% endif %}
    {% endwith %}
    
    <form method="POST">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="form-row">
            <label for="senha">Nova Senha</label>
            <input id="senha" type="password" name="senha" required>
        </div>
        <button type="submit">Salvar Nova Senha</button>
    </form>
    
    <p class="auth-link"><a href="{{ url_for('login') }}">Voltar para o login</a></p>
    </section>
  </main>
</body>
</html>

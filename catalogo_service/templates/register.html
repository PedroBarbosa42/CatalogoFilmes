{% extends "auth_base.html" %}
{% block title %}Criar conta | CatálogoFilmes{% endblock %}
{% block form_content %}
<h1 class="auth-title">Criar conta</h1>
<form method="POST" class="auth-form">
    <div class="auth-field">
        <input id="nome" type="text" name="nome" placeholder=" " required>
        <label for="nome">Nome</label>
    </div>
    <div class="auth-field">
        <input id="email" type="email" name="email" placeholder=" " required>
        <label for="email">E-mail</label>
    </div>
    <div class="auth-field">
        <input id="senha" type="password" name="senha" placeholder=" " required>
        <label for="senha">Senha</label>
    </div>
    <button type="submit" class="btn-block">Cadastrar</button>
</form>
<p class="auth-divider">Já tem uma conta? <a href="/login">Entrar</a></p>
{% endblock %}

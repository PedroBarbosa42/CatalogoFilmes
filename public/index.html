<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Tom Hanks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-section" class="auth-container">
        <div id="login-box" class="auth-box">
            <h2>Entrar</h2>
            <form id="form-login">
                <div class="input-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="input-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" required>
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
            <p class="toggle-text">Não tem uma conta? <a href="#" id="link-cadastro">Cadastre-se</a></p>
            <div id="login-erro" class="msg-erro"></div>
        </div>

        <div id="cadastro-box" class="auth-box hidden">
            <h2>Criar Conta</h2>
            <form id="form-cadastro">
                <div class="input-group">
                    <label for="cadastro-nome">Nome</label>
                    <input type="text" id="cadastro-nome" required>
                </div>
                <div class="input-group">
                    <label for="cadastro-email">E-mail</label>
                    <input type="email" id="cadastro-email" required>
                </div>
                <div class="input-group">
                    <label for="cadastro-senha">Senha</label>
                    <input type="password" id="cadastro-senha" required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>
            <p class="toggle-text">Já tem uma conta? <a href="#" id="link-login">Faça Login</a></p>
            <div id="cadastro-erro" class="msg-erro"></div>
        </div>
    </div>

    <div id="catalogo-section" class="hidden">
        <header>
            <h1>Filmes de Tom Hanks</h1>
            <div>
                <span id="user-display"></span>
                <button id="btn-logout" class="btn-secondary">Sair</button>
            </div>
        </header>
        <main>
            <div id="lista-filmes" class="grid-filmes"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
